{% extends "base.html" %}

{% block content %}
<div class="login-bg py-5 d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card login-card shadow-lg border-0 rounded-4 fade-in">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <span class="login-icon mb-2"><i class="fas fa-sign-in-alt fa-2x"></i></span>
                            <h2 class="fw-bold mb-2" style="font-family: 'Poppins', sans-serif;">Sign In to EventEase</h2>
                            <p class="text-muted mb-0">Welcome back! Please login to your account.</p>
                        </div>
                        <form method="POST">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg login-btn">Login</button>
                            </div>
                        </form>
                        <div class="text-center mt-4">
                            <p class="mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="fw-semibold text-primary">Register here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
.login-bg {
    background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
    min-height: 100vh;
}
.login-card {
    border-radius: 2rem !important;
    box-shadow: 0 8px 32px rgba(78, 84, 200, 0.13);
    background: #fff;
    animation: fadeInUp 1.1s cubic-bezier(.4,2,.3,1) both;
}
.login-icon {
    color: #4e54c8;
    background: #f3f0ff;
    border-radius: 50%;
    padding: 0.7rem 1rem;
    display: inline-block;
    margin-bottom: 0.5rem;
    box-shadow: 0 2px 8px rgba(78, 84, 200, 0.10);
}
.login-btn {
    font-weight: 600;
    border-radius: 2rem;
    font-size: 1.1rem;
    letter-spacing: 0.5px;
    transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
    box-shadow: 0 2px 8px rgba(78, 84, 200, 0.08);
}
.login-btn:hover {
    transform: translateY(-2px) scale(1.04);
    background: #43cea2;
    border-color: #43cea2;
}
.fade-in {
    animation: fadeInUp 1.1s cubic-bezier(.4,2,.3,1) both;
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
{% endblock %}
